on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - next
  pull_request:
    branches:
      - master

concurrency:
  group: robot
  cancel-in-progress: false

permissions:
  contents: read

name: Build robot

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        java: [ 17, 21, 25 ]
    name: Java ${{ matrix.java }} build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # To make git describe give the intended output
          fetch-tags: true
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven
      - name: Package
        run: TZ=UTC ./mvnw -B -P exe
      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/v') && matrix.java == '21'
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            tool/target/apdu4j.jar
            tool/target/apdu4j.exe
      - name: Set up publishing
        if: matrix.java == '21' && ( github.ref == 'refs/heads/master' || github.ref == 'refs/heads/next' || startsWith(github.ref, 'refs/tags/v') )
        uses: martinpaljak/maven-ssh-deploy@v2
        with:
          host: mvn.javacard.pro
          key: ${{ secrets.SSH_KEY }}
          fingerprint: SHA256:auiF3nHWvDmvq2stDl+QEECCqMcDp+FY1/bDRnvxpRw
      - name: Deploy
        if: matrix.java == '21' && ( github.ref == 'refs/heads/master' || github.ref == 'refs/heads/next' || startsWith(github.ref, 'refs/tags/v') )
        run: TZ=UTC ./mvnw -B deploy -DskipTests
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            apdu4j.jar
            apdu4j.exe
          fail_on_unmatched_files: true
          body: Release ${{ github.ref_name }}
          prerelease: true # manually promoted
